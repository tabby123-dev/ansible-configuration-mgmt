---
- name: Install Apache and Git
  become: yes
  ansible.builtin.apt:
    name:
      - apache2
      - git
    state: present
    update_cache: yes

- name: Clone tooling solution repository
  become: yes
  ansible.builtin.git:
    repo: 'https://github.com/tabby123-dev/tooling-solution.git'
    dest: /home/ubuntu/tooling-solution
    version: main

- name: Copy website files to Apache document root
  become: yes
  ansible.builtin.copy:
    src: /home/ubuntu/tooling-solution/html/
    dest: /var/www/html/
    remote_src: yes
    owner: www-data
    group: www-data
    mode: preserve

- name: Start and enable Apache service
  become: yes
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes


